<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>广告思想简史</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h1>广告思想简史</h1>
        <button class="lang-btn" onclick="toggleLang()">EN</button>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📚 导航</h2>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <nav>
            <a href="#" data-page="home" class="nav-link active" onclick="navigate('home')">🏠 首页</a>
            <a href="#" data-page="timeline" class="nav-link" onclick="navigate('timeline')">📅 大事年表</a>
            <a href="#" data-page="stars" class="nav-link" onclick="navigate('stars')">⭐ 百位巨星</a>
            <a href="#" data-page="campaigns" class="nav-link" onclick="navigate('campaigns')">🎬 百大广告</a>
            <a href="#" data-page="articles" class="nav-link" onclick="navigate('articles')">📝 文章</a>
            <a href="#" data-page="search" class="nav-link" onclick="navigate('search')">🔍 搜索</a>
            <a href="#" data-page="data" class="nav-link" onclick="navigate('data')">📊 行业数据</a>
        </nav>
        <div class="auth-section" id="auth-section">
            <div id="guest-ui">
                <button class="btn-primary" onclick="showLogin()">登录</button>
            </div>
            <div id="user-ui" style="display:none">
                <p id="user-name"></p>
                <button class="btn-secondary" onclick="logout()">退出</button>
            </div>
        </div>
    </aside>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Pages rendered here by JS -->
    </main>

    <!-- Login Modal -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3>登录</h3>
            <input type="text" id="login-user" placeholder="用户名">
            <input type="password" id="login-pass" placeholder="密码">
            <p id="login-error" class="error-msg"></p>
            <button class="btn-primary" onclick="doLogin()">登录</button>
            <button class="btn-secondary" onclick="closeLogin()">取消</button>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Initialize Capacitor if available
        if (window.Capacitor) {
            window.Capacitor.Plugins.StatusBar?.setStyle({ style: 'DARK' });
        }
        // Start app
        navigate('home');
    </script>
</body>
</html>
